version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: pauseflow-postgres
    environment:
      POSTGRES_DB: pauseflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pauseflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pauseflow.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  pgdata:
